es:
  site_settings:
    peertube_embed_enabled: "Insertar videos y transmisiones en vivo de PeerTube de las instancias listadas abajo."
    peertube_embed_instances: "Dominios de instancias PeerTube cuyos enlaces se insertan (por ejemplo tube.example.org). Volvé a procesar (rebake) los posts existentes después de cambiar esta lista."
    peertube_embed_click_to_play: "Mostrar una miniatura y cargar el reproductor de PeerTube solo al hacer clic."
    peertube_embed_theater_mode: "Mostrar un botón que agranda el reproductor más allá de la columna del post."
    peertube_embed_composer_button: "Agregar un botón en el editor para insertar un video de PeerTube."
    peertube_embed_topic_list_thumbnails: "Mostrar la miniatura del video junto a los temas que contienen un video de PeerTube."
    peertube_embed_videos_page: "Activar la galería /videos y su enlace en la barra lateral."
    peertube_embed_home_instance: "Instancia PeerTube que se muestra en la pestaña Instancia de /videos. Dejalo vacío para usar la primera instancia permitida."
    peertube_embed_videos_default_tab: "Pestaña que abre primero /videos: all (comunidad e instancia mezcladas), community o instance."
    peertube_embed_live_refresh_seconds: "Cada cuántos segundos se actualizan el estado y los espectadores de los videos en vivo."
    peertube_embed_sync_event_livestream_hosts: "Agregar las instancias PeerTube a los hosts permitidos de transmisiones de eventos, para que la URL de transmisión de un evento pueda apuntar a PeerTube."
    peertube_embed_upload_enabled: "Permitir que los usuarios autorizados suban videos a la instancia PeerTube principal desde el editor."
    peertube_embed_upload_username: "Cuenta de PeerTube usada para las subidas (se recomienda una cuenta de servicio dedicada)."
    peertube_embed_upload_password: "Contraseña de la cuenta de subidas de PeerTube."
    peertube_embed_upload_channel: "Canal de PeerTube por defecto para las subidas (lo que va después de /c/ en la URL del canal)."
    peertube_embed_upload_category_channels: "Canales opcionales por categoría, como slug-de-categoría:nombre-del-canal. Las categorías que no figuran usan el canal por defecto."
    peertube_embed_upload_allowed_groups: "Grupos que pueden subir videos a PeerTube."
    peertube_embed_upload_max_size_mb: "Tamaño máximo de video en MB para las subidas. 0 significa sin límite acá; la cuota y los límites de PeerTube siguen aplicando."
  peertube_embed:
    upload_errors:
      not_allowed: "No tenés permiso para subir videos."
      not_configured: "Las subidas de video no están configuradas."
      invalid_file: "Este archivo no es un video compatible."
      too_large: "Este video supera el tamaño permitido."
      quota: "Se alcanzó la cuota de videos de PeerTube."
      no_channel: "No hay un canal de PeerTube configurado para las subidas."
      auth_failed: "El foro no pudo iniciar sesión en PeerTube. Revisá la cuenta de subidas en los ajustes."
      unreachable: "No se pudo conectar con la instancia PeerTube."
      not_found: "Esta subida ya no existe. Empezala de nuevo."
      offset_mismatch: "La subida se desincronizó y se va a retomar."
      invalid_chunk: "Datos de subida inválidos."
      failed: "PeerTube rechazó la subida."
