en:
  site_settings:
    peertube_embed_enabled: "Embed PeerTube videos and live streams from the instances listed below."
    peertube_embed_instances: "PeerTube instance domains whose links are embedded (for example tube.example.org). Rebake existing posts after changing this list."
    peertube_embed_click_to_play: "Show a thumbnail and only load the PeerTube player when it is clicked."
    peertube_embed_theater_mode: "Show a button that enlarges the player beyond the post column."
    peertube_embed_composer_button: "Add a composer toolbar button to insert a PeerTube video."
    peertube_embed_topic_list_thumbnails: "Show the video thumbnail next to topics that contain a PeerTube video."
    peertube_embed_videos_page: "Enable the /videos gallery page and its sidebar link."
    peertube_embed_home_instance: "PeerTube instance shown in the /videos Instance tab. Leave empty to use the first allowed instance."
    peertube_embed_videos_default_tab: "Tab opened first on /videos: all (community and instance mixed), community or instance."
    peertube_embed_live_refresh_seconds: "How often, in seconds, the live state and viewer count of live videos are refreshed."
    peertube_embed_sync_event_livestream_hosts: "Add the PeerTube instances to the events livestream allowed hosts so an event's livestream URL can point to PeerTube."
    peertube_embed_upload_enabled: "Let allowed users upload videos to the home PeerTube instance from the composer."
    peertube_embed_upload_username: "PeerTube account used for uploads (a dedicated service account is recommended)."
    peertube_embed_upload_password: "Password of the PeerTube upload account."
    peertube_embed_upload_channel: "Default PeerTube channel name for uploads (the part after /c/ in the channel URL)."
    peertube_embed_upload_category_channels: "Optional per-category channels, as category-slug:channel-name. Categories not listed use the default channel."
    peertube_embed_upload_allowed_groups: "Groups allowed to upload videos to PeerTube."
    peertube_embed_upload_max_size_mb: "Maximum video size in MB for uploads (PeerTube quotas still apply)."
  peertube_embed:
    upload_errors:
      not_allowed: "You are not allowed to upload videos."
      not_configured: "Video uploads are not configured."
      invalid_file: "This file is not a supported video."
      too_large: "This video is larger than the allowed size."
      quota: "The PeerTube video quota has been reached."
      no_channel: "No PeerTube channel is configured for uploads."
      auth_failed: "The forum could not sign in to PeerTube. Check the upload account settings."
      unreachable: "The PeerTube instance could not be reached."
      not_found: "This upload no longer exists. Start it again."
      offset_mismatch: "The upload got out of sync and will resume."
      invalid_chunk: "Invalid upload data."
      failed: "PeerTube rejected the upload."
